[workspace]
members = ["."]

[package]
name = "orskit-py"
version = "0.1.0"
edition = "2021"
authors = ["Wouittone"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wouittone/orskit"
description = "Python bindings for orskit orbital mechanics library"

[lib]
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.21", features = ["extension-module"] }
orskit-core = { path = "../../crates/core" }
orskit-frames = { path = "../../crates/frames" }
orskit-units = { path = "../../crates/units" }
orskit-measurements = { path = "../../crates/measurements" }
orskit-utils = { path = "../../crates/utils" }
