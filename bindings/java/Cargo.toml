[workspace]
members = ["."]

[package]
name = "jni"
version = "0.1.0"
edition = "2021"
rust-version = "1.96.1"
authors = ["Wouittone"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wouittone/orskit"
description = "Java FFM bindings for orskit orbital mechanics library"

[lib]
crate-type = ["cdylib"]

[dependencies]
core_crate = { package = "core", path = "../../crates/core" }
frames = { path = "../../crates/frames" }
units = { path = "../../crates/units" }
measurements = { path = "../../crates/measurements" }
utils = { path = "../../crates/utils" }
