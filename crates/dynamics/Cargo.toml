[package]
name = "dynamics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Feature-gated facade for orskit dynamics capabilities"

[lib]
name = "dynamics"

[features]
default = []
numerical = ["dep:dynamics_numerical"]
sgp4 = [
    "dep:frames",
    "dep:hifitime",
    "dep:orskit_core",
    "dep:orbits",
    "dep:sgp4",
    "dep:thiserror",
    "dep:units",
]
two-bodies = ["dep:dynamics_two_bodies"]
point-mass = ["two-bodies", "dynamics_two_bodies/point-mass"]

[dependencies]
dynamics_core = { package = "dynamics-core", path = "core" }
dynamics_numerical = { package = "dynamics-numerical", path = "numerical", optional = true }
dynamics_two_bodies = { package = "dynamics-two-bodies", path = "two-bodies", optional = true }
frames = { path = "../frames", optional = true }
hifitime = { workspace = true, optional = true }
orskit_core = { package = "core", path = "../core", optional = true }
orbits = { path = "../orbits", features = ["cartesian"], optional = true }
sgp4 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
units = { path = "../units", optional = true }
