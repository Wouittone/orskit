[package]
name = "dynamics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Feature-gated facade for orskit dynamics capabilities"

[lib]
name = "dynamics"

[features]
default = []
two-bodies = ["dep:dynamics_two_bodies"]
point-mass = ["two-bodies", "dynamics_two_bodies/point-mass"]

[dependencies]
dynamics_core = { package = "dynamics-core", path = "core" }
dynamics_two_bodies = { package = "dynamics-two-bodies", path = "two-bodies", optional = true }
