[package]
name = "orskit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Public Rust facade for orskit astrodynamics"

[features]
default = []
bodies = ["dep:bodies"]
ccsds = ["dep:ccsds", "cartesian"]
cartesian = ["dep:orbits", "orbits/cartesian"]
dynamics = ["dep:dynamics"]
orbit-determination = ["dep:orbit_determination"]
point-mass-gravity = ["dep:gravity", "gravity/point-mass"]
two-bodies = ["cartesian", "dynamics", "point-mass-gravity", "dynamics/point-mass"]
measurements = ["dep:measurements"]
quaternion-attitude = ["orskit_core/quaternion-attitude"]
standard-shapes = ["orskit_core/standard-shapes"]
measurement-range = ["measurements", "measurements/range"]
measurement-range-rate = ["measurements", "measurements/range-rate"]
measurement-azimuth-elevation = ["measurements", "measurements/azimuth-elevation"]
measurement-doppler = ["measurements", "measurements/doppler"]
measurement-angular-ra-dec = ["measurements", "measurements/angular-ra-dec"]
measurement-bistatic-range = ["measurements", "measurements/bistatic-range"]
measurement-bistatic-range-rate = ["measurements", "measurements/bistatic-range-rate"]
measurement-turnaround-range = ["measurements", "measurements/turnaround-range"]
measurement-tdoa = ["measurements", "measurements/tdoa"]
measurement-fdoa = ["measurements", "measurements/fdoa"]
measurement-phase = ["measurements", "measurements/phase"]
measurement-clock-correction = ["measurements", "measurements/clock-correction"]
measurement-troposphere-correction = ["measurements", "measurements/troposphere-correction"]
measurement-ionosphere-correction = ["measurements", "measurements/ionosphere-correction"]
measurement-relativity-correction = ["measurements", "measurements/relativity-correction"]
measurement-instrument-correction = ["measurements", "measurements/instrument-correction"]
measurement-estimation = ["measurements", "measurements/estimation"]
measurement-light-time = ["measurement-estimation", "measurements/light-time"]
measurement-geometric-range = ["measurement-estimation", "measurements/geometric-range"]
measurement-geometric-range-rate = ["measurement-estimation", "measurements/geometric-range-rate"]
measurement-geometric-azimuth-elevation = ["measurement-estimation", "measurements/geometric-azimuth-elevation"]
measurement-geometric-doppler = ["measurement-estimation", "measurements/geometric-doppler"]
measurement-geometric-angular-ra-dec = ["measurement-estimation", "measurements/geometric-angular-ra-dec"]
measurement-geometric-bistatic-range = ["measurement-estimation", "measurements/geometric-bistatic-range"]
measurement-geometric-bistatic-range-rate = ["measurement-estimation", "measurements/geometric-bistatic-range-rate"]
measurement-geometric-turnaround-range = ["measurement-estimation", "measurements/geometric-turnaround-range"]
measurement-geometric-tdoa = ["measurement-estimation", "measurements/geometric-tdoa"]
measurement-geometric-fdoa = ["measurement-estimation", "measurements/geometric-fdoa"]
measurement-geometric-phase = ["measurement-estimation", "measurements/geometric-phase"]

[dependencies]
bodies = { path = "../bodies", optional = true }
ccsds = { path = "../ccsds", optional = true }
orskit_core = { package = "core", path = "../core", default-features = false }
dynamics = { path = "../dynamics", optional = true }
orbit_determination = { package = "orbit-determination", path = "../orbit-determination", optional = true }
gravity = { path = "../gravity", optional = true }
frames = { path = "../frames" }
measurements = { path = "../measurements", optional = true, default-features = false }
orbits = { path = "../orbits", optional = true }
units = { path = "../units" }
