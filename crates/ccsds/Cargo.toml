[package]
name = "orskit-ccsds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Streaming CCSDS navigation-message ingestion for orskit"

[lib]
name = "ccsds"

[features]
default = ["async", "parallel"]
async = ["dep:tokio"]
parallel = ["dep:rayon"]

[dependencies]
core_crate = { package = "orskit-core", path = "../core" }
orbits_cartesian = { package = "orskit-orbits-cartesian", path = "../orbits-cartesian" }
frames = { package = "orskit-frames", path = "../frames" }
units = { package = "orskit-units", path = "../units" }
rayon = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util"], optional = true }

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt"] }

[[bench]]
name = "oem"
harness = false
