[package]
name = "orskit-dynamics-two-body"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Point-mass two-body dynamics and elliptic Kepler propagation for orskit"

[lib]
name = "dynamics_two_body"

[dependencies]
core_crate = { package = "orskit-core", path = "../core" }
dynamics = { package = "orskit-dynamics", path = "../dynamics" }
gravity_point_mass = { package = "orskit-gravity-point-mass", path = "../gravity-point-mass" }
hifitime.workspace = true
orbits_cartesian = { package = "orskit-orbits-cartesian", path = "../orbits-cartesian" }
thiserror.workspace = true
units = { package = "orskit-units", path = "../units" }

[dev-dependencies]
bodies = { package = "orskit-bodies", path = "../bodies" }

[[example]]
name = "two_body_benchmark"
path = "examples/two_body_benchmark.rs"
