[package]
name = "core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core orbital mechanics library for orskit"

[lib]
name = "orskit_core"

[features]
default = ["quaternion-attitude", "standard-shapes"]
# Built-in implementations of the open attitude and geometry contracts.
quaternion-attitude = []
standard-shapes = []

[dependencies]
hifitime.workspace = true
nalgebra.workspace = true
frames = { path = "../frames" }
units = { path = "../units" }
thiserror.workspace = true
