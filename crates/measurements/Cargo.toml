[package]
name = "measurements"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Measurement and observation utilities for orskit"

[lib]
name = "measurements"

[features]
default = [
    "range",
    "range-rate",
    "azimuth-elevation",
    "doppler",
    "angular-ra-dec",
    "bistatic-range",
    "bistatic-range-rate",
    "turnaround-range",
    "tdoa",
    "fdoa",
    "phase",
    "clock-correction",
    "troposphere-correction",
    "ionosphere-correction",
    "relativity-correction",
    "instrument-correction",
    "geometric-range",
    "geometric-range-rate",
    "geometric-azimuth-elevation",
    "geometric-doppler",
    "geometric-angular-ra-dec",
    "geometric-bistatic-range",
    "geometric-bistatic-range-rate",
    "geometric-turnaround-range",
    "geometric-tdoa",
    "geometric-fdoa",
    "geometric-phase",
    "light-time",
]
# Built-in observable families.  Disable default features and select only the
# implementations an application uses; the composition traits remain available.
range = []
range-rate = []
azimuth-elevation = []
doppler = []
angular-ra-dec = []
bistatic-range = []
bistatic-range-rate = []
turnaround-range = []
tdoa = []
fdoa = []
phase = []
# Built-in correction-provenance markers.
clock-correction = []
troposphere-correction = []
ionosphere-correction = []
relativity-correction = []
instrument-correction = []
# The implementation-neutral estimation contracts are always available. These
# feature-gated instantaneous geometric implementations can be selected per
# observable family.
estimation = []
geometric-range = ["estimation", "range"]
geometric-range-rate = ["estimation", "range-rate"]
geometric-azimuth-elevation = ["estimation", "azimuth-elevation"]
geometric-doppler = ["estimation", "doppler", "dep:utils"]
geometric-angular-ra-dec = ["estimation", "angular-ra-dec"]
geometric-bistatic-range = ["estimation", "bistatic-range"]
geometric-bistatic-range-rate = ["estimation", "bistatic-range-rate"]
geometric-turnaround-range = ["estimation", "turnaround-range"]
geometric-tdoa = ["estimation", "tdoa", "dep:utils"]
geometric-fdoa = ["estimation", "fdoa", "dep:utils"]
geometric-phase = ["estimation", "phase", "dep:utils"]
# Iterative vacuum light-time timing for an arbitrary signal path. Frame
# conversion remains caller-provided through `frames` contracts.
light-time = ["estimation", "dep:utils"]

[dependencies]
hifitime.workspace = true
nalgebra.workspace = true
frames = { path = "../frames" }
units = { path = "../units" }
thiserror.workspace = true
utils = { path = "../utils", optional = true }
