name: CI - Assurance and documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV (Rust 1.96.1)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install minimum supported Rust
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Check workspace at MSRV
        run: cargo check --workspace --all-targets --all-features --locked

  dependencies:
    name: Dependency licenses and advisories
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check licenses, advisories, and sources
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          rust-version: "1.96.1"
          command: check advisories licenses sources
          arguments: --all-features --locked

  coverage:
    name: Coverage report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust with coverage tools
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate LCOV report
        run: cargo llvm-cov --workspace --all-targets --all-features --locked --lcov --output-path lcov.info

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error
          retention-days: 14

  documentation:
    name: Build documentation
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1

      - name: Build workspace documentation
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Add documentation landing page
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          printf '%s\n' '<!doctype html><meta http-equiv="refresh" content="0; url=orskit/index.html"><title>orskit documentation</title><a href="orskit/index.html">orskit documentation</a>' > target/doc/index.html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  publish-documentation:
    name: Publish documentation
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
