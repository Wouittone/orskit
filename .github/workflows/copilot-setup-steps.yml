name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Install Rust Analyzer MCP server
        run: cargo install r3bl-rust-analyzer-mcp-server --version 1.1.4 --locked
      - name: Install docs.rs MCP server
        run: cargo install docs-rs-mcp --version 0.1.0-alpha.4 --locked
