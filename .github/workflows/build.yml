name: CI - Rust workspace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: nextest

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Check representative feature matrix
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./scripts/check_feature_matrix.ps1

      - name: Lint Rust workspace
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -D clippy::must-use-candidate

      - name: Test Rust workspace
        run: cargo nextest run --workspace --all-targets --all-features --locked

      - name: Test Rust documentation (not supported by nextest)
        if: runner.os == 'Linux'
        run: cargo test --workspace --doc --all-features --locked

      - name: Build Rust documentation
        if: runner.os == 'Linux'
        run: cargo doc --workspace --all-features --no-deps --locked
