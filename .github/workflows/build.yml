name: CI - Linux Rust workspace

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust workspace (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test Rust workspace
        run: cargo test --workspace --all-features --locked

      - name: Build Rust documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  bindings:
    name: Native binding smoke checks (Linux x86_64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            bindings/python/target
            bindings/java/target
          key: linux-bindings-cargo-${{ hashFiles('bindings/python/Cargo.lock', 'bindings/java/Cargo.lock') }}
          restore-keys: linux-bindings-cargo-

      - name: Check Python native binding
        run: cargo check --manifest-path bindings/python/Cargo.toml --locked
        env:
          PYO3_PYTHON: python3

      - name: Check Java native binding
        run: cargo test --manifest-path bindings/java/Cargo.toml --locked
