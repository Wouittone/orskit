name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Rust workspace quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.96.1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.1
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          tool: nextest

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Rust workspace
        run: cargo check --workspace --all-targets --all-features --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings -D clippy::must-use-candidate

      - name: Test Rust workspace
        run: cargo nextest run --workspace --all-targets --all-features --locked

      - name: Test Rust documentation (not supported by nextest)
        run: cargo test --workspace --doc --all-features --locked

      - name: Build Rust documentation
        run: cargo doc --workspace --all-features --no-deps --locked

  minimal-features:
    name: Minimal feature set
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: "1.96.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.1
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check each package without default features
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[].manifest_path' \
            | while IFS= read -r manifest; do
                cargo check --locked --manifest-path "$manifest" --no-default-features
              done

  platform-smoke:
    name: ${{ matrix.os }} smoke tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: "1.96.1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # 1.96.1
        with:
          toolchain: 1.96.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Test library targets
        run: cargo test --workspace --lib --locked
