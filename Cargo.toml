[workspace]
resolver = "2"
members = [
    "crates/bodies",
    "crates/ccsds",
    "crates/core",
    "crates/dynamics",
    "crates/dynamics/core",
    "crates/dynamics/numerical",
    "crates/dynamics/two-bodies",
    "crates/frames",
    "crates/gravity",
    "crates/measurements",
    "crates/orskit",
    "crates/orbits",
    "crates/orbit-determination",
    "crates/units",
    "crates/utils",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.96.1"
authors = ["Wouittone"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wouittone/orskit"

[workspace.dependencies]
hifitime = "4.3.0"
nalgebra = "0.35.0"
rayon = "1.12.0"
thiserror = "2.0.18"
tokio = "1.52.3"
uom = { version = "0.38.0", default-features = false, features = ["autoconvert", "f64", "si", "std"] }
