[workspace]
members = [
    "crates/core",
    "crates/frames",
    "crates/measurements",
    "crates/units",
    "crates/utils",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Wouittone"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Wouittone/orskit"

[workspace.dependencies]
hifitime = "4.3"
nalgebra = "0.34"
thiserror = "2"
uom = { version = "0.38", default-features = false, features = ["autoconvert", "f64", "si", "std"] }
